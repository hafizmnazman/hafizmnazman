name: generate contribution snake

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: hafizmnazman
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#1f2328&color_dots=#ebedf0,#b6d2f8,#6f9df8,#0969da,#0a3069
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#e6edf3&color_dots=#161b22,#0c2d6b,#0d419d,#388bfd,#79c0ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
